{% extends "base.html" %}
{% block title %}{{ title }} - KeyFit{% endblock %}
{% block content %}
<main>
  <h2>{{ title }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
      <ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}
    {{ form.as_p }}
    <button class="btn" type="submit">{{ submit_label }}</button>
    <a class="btn secondary" href="{% url 'profile_list' %}">Cancel</a>
  </form>
</main>
{% endblock %}
