{% extends "base.html" %}
{% block title %}Log in - KeyFit{% endblock %}
{% block content %}
<main>
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="msg error">Invalid username or password.</div>
    {% endif %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'register' %}">Register</a></p>
</main>
{% endblock %}
