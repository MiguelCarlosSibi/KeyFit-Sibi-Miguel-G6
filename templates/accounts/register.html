{% extends "base.html" %}
{% block title %}Register - KeyFit{% endblock %}
{% block content %}
<main>
  <h2>Create your account</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
</main>
{% endblock %}
